appId: com.mocodesu.dailyforge.dev

flows:
  - "onboarding/*"
  - "daily/*"

executionOrder:
  continueOnFailure: true
  flowsOrder:
    - onboarding/full-happy-path
    - onboarding/back-navigation
    - onboarding/validation
    - onboarding/imperial-units
    - onboarding/keyboard-visible
